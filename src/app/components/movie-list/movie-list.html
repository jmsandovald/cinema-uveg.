<div class="container" style="display: flex; gap: 25px; padding: 25px; max-width: 1200px; margin: 0 auto;">
  
  <!-- Columna izquierda: Lista de películas con scroll -->
  <div style="flex: 1; max-width: 450px;">
    <h2 style="color: #1a365d; font-size: 1.3rem; margin-bottom: 15px; font-weight: bold;">Lo Mejor Calificado</h2>
    
    <div style="max-height: 75vh; overflow-y: auto; padding-right: 5px;">
      <ul style="list-style: none; padding: 0; margin: 0;">
        @for (movie of movies; track movie.id) {
          <li (click)="onSelectMovie(movie.id)" 
              style="padding: 14px 18px; margin-bottom: 10px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; cursor: pointer; transition: all 0.2s;"
              onmouseover="this.style.background='#e9ecef'; this.style.borderColor='#adb5bd';" 
              onmouseout="this.style.background='#f8f9fa'; this.style.borderColor='#dee2e6'">
            <strong style="color: #212529; display: block; font-size: 1rem; margin-bottom: 4px;">{{ movie.title }}</strong>
            <span style="color: #495057; font-size: 0.85rem; font-weight: 500;">⭐ Calificación: {{ movie.vote_average }}</span>
          </li>
        }
      </ul>
    </div>
  </div>

  <!-- Columna derecha: Detalle de la película seleccionada -->
  <div style="flex: 2; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 25px; height: fit-content; min-height: 300px;">
    @if (selectedMovieId === 0) {
      <p style="color: #6c757d; font-style: italic; text-align: center; margin-top: 100px; font-size: 1.1rem;">
        Toca una película de la lista para ver de qué trata.
      </p>
    } @else {
      <app-movie-detail [movieId]="selectedMovieId"></app-movie-detail>
    }
  </div>

</div>
